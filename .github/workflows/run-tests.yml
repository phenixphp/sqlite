name: run-tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: pcov
          extensions: mbstring pdo sqlite3 pdo_sqlite intl json fileinfo pcntl dom xml openssl

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-suggest

      - name: Check code formatting with PHP CS Fixer
        run: |
          vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: Analyze code statically with PHPStan
        run: |
          vendor/bin/phpstan

      - name: Execute tests
        run: |
          vendor/bin/phpunit --coverage-html build/coverage --log-junit build/report.junit.xml --coverage-clover build/logs/clover.xml --colors=always

      - name: Prepare paths for SonarQube analysis
        run: |
          sed -i "s|$GITHUB_WORKSPACE|/github/workspace|g" build/logs/clover.xml
          sed -i "s|$GITHUB_WORKSPACE|/github/workspace|g" build/report.junit.xml

      - name: Run SonarQube analysis
        uses: sonarsource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
